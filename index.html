<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gatenspel 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#87ceeb; font-family:-apple-system,system-ui,sans-serif; touch-action:none; }
  #game { display:block; width:100%; height:100%; }
  #hud { position:fixed; top:env(safe-area-inset-top,0); left:0; right:0; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; color:#fff; font-weight:800; font-size:22px; text-shadow:0 2px 6px rgba(0,0,0,.55); pointer-events:none; }
  #timer { font-variant-numeric:tabular-nums; background:rgba(0,0,0,.25); padding:4px 14px; border-radius:20px; }
  #size { position:fixed; bottom:calc(env(safe-area-inset-bottom,0) + 14px); left:0; right:0; text-align:center; color:#fff; font-weight:800; font-size:16px; text-shadow:0 2px 6px rgba(0,0,0,.55); pointer-events:none; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(20,20,40,.9); color:#fff; text-align:center; z-index:10; padding:20px; }
  .overlay h1 { font-size:clamp(38px,11vw,60px); margin-bottom:10px; letter-spacing:-1px; }
  .overlay p { font-size:clamp(17px,4.5vw,21px); opacity:.9; margin-bottom:28px; max-width:520px; line-height:1.45; }
  .btn { background:#ff5a5f; color:#fff; border:none; padding:18px 46px; font-size:24px; font-weight:800; border-radius:40px; box-shadow:0 6px 20px rgba(255,90,95,.5); }
  .btn:active { transform:scale(.95); }
  #scoreVal { color:#ffd166; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div>Score <span id="scoreVal">0</span></div><div id="timer">2:00</div></div>
<div id="size"></div>
<div class="overlay" id="startScreen">
  <h1>🕳️ Gatenspel 3D</h1>
  <p>Sleep met je vinger om het gat te bewegen. Slok mensen, auto's, bomen en zelfs hele huizen op — en word gigantisch! 😋</p>
  <button class="btn" onclick="startGame()">Spelen</button>
</div>
<div class="overlay" id="endScreen" style="display:none">
  <h1 id="endTitle">Tijd om!</h1>
  <p id="endMsg"></p>
  <button class="btn" onclick="startGame()">Nog een keer!</button>
</div>

<script>
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// ---------- isometrische projectie ----------
const ISO=0.5;                 // 2:1 iso
function proj(wx,wy,wz){ return { x:(wx-wy), y:(wx+wy)*ISO - (wz||0) }; }

const WORLD=2000;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

// object-soorten: [emoji, straal, hoogte, kleur, punten]
const TYPES=[
  ['🌳',16,34,'#3a7d44',1],['🌲',15,40,'#2d6a4f',1],['🚦',10,30,'#e63946',1],
  ['🧍',9,26,'#f4a261',2],['🧑',9,26,'#e9c46a',2],['🐕',9,16,'#b5838d',2],['🚲',12,18,'#457b9d',2],
  ['🚗',20,20,'#e76f51',4],['🚕',20,20,'#ffb703',4],['🌴',16,44,'#2a9d8f',3],['⛲',22,24,'#48cae4',4],
  ['🚌',28,26,'#f77f00',7],['🚚',30,26,'#8ecae6',7],['🏠',40,52,'#ffb4a2',10],['🏡',42,54,'#cdb4db',10],
  ['🏢',52,90,'#a2d2ff',16],['🏬',56,80,'#bde0fe',16],['🗼',48,120,'#adb5bd',20],['🎡',60,110,'#ff85a1',24]
];

let hole,objects,particles,score,timeLeft,playing,lastT,shake,funText,funTimer;

function makeCity(){
  objects=[];
  const push=(n,filter)=>{ for(let i=0;i<n;i++){ const t=pick(TYPES.filter(filter)); objects.push({
    x:rand(30,WORLD-30), y:rand(30,WORLD-30), e:t[0], r:t[1], h:t[2], c:t[3], pts:t[4],
    eaten:false, fall:0, wob:rand(0,6.28) }); } };
  push(160, t=>t[1]<=16);   // klein
  push(70,  t=>t[1]>16&&t[1]<=30); // middel
  push(26,  t=>t[1]>30);    // groot
}

function startGame(){
  startScreen.style.display='none'; endScreen.style.display='none';
  hole={ x:WORLD/2, y:WORLD/2, r:24, tx:WORLD/2, ty:WORLD/2 };
  makeCity(); particles=[]; score=0; timeLeft=120; playing=true; shake=0; funText=''; funTimer=0;
  lastT=performance.now(); updateHUD(); requestAnimationFrame(loop);
}
function updateHUD(){ scoreVal.textContent=score; const m=timeLeft/60|0,s=timeLeft%60|0; timer.textContent=m+':'+String(s).padStart(2,'0'); document.getElementById('size').textContent='Gatgrootte: '+Math.round(hole.r); }

// ---------- geluid ----------
let AC;
function beep(freq,dur,type,vol){ try{ AC=AC||new (window.AudioContext||webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol||0.15; o.connect(g); g.connect(AC.destination); const t=AC.currentTime; o.start(t); o.frequency.exponentialRampToValueAtTime(freq*0.5,t+dur); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.stop(t+dur); }catch(e){} }
function gulp(r){ beep(180+Math.min(r,400), 0.14, 'sine', 0.18); }

// ---------- besturing ----------
let dragging=false,dx0=0,dy0=0;
const pt=e=>{const t=e.touches?e.touches[0]:e; return{x:t.clientX,y:t.clientY};};
cv.addEventListener('touchstart',e=>{e.preventDefault(); if(AC&&AC.state==='suspended')AC.resume(); const p=pt(e); dragging=true; dx0=p.x; dy0=p.y;},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault(); if(!dragging)return; const p=pt(e); mv(p.x-dx0,p.y-dy0); dx0=p.x; dy0=p.y;},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault(); dragging=false;},{passive:false});
cv.addEventListener('mousedown',e=>{dragging=true; dx0=e.clientX; dy0=e.clientY;});
addEventListener('mousemove',e=>{if(!dragging)return; mv(e.clientX-dx0,e.clientY-dy0); dx0=e.clientX; dy0=e.clientY;});
addEventListener('mouseup',()=>dragging=false);
// sleep-richting terug naar wereld-assen (iso omgekeerd)
function mv(sdx,sdy){ if(!playing)return; const sp=2.2; const wx=(sdx*0.5 + sdy/ISO*0.5), wy=(-sdx*0.5 + sdy/ISO*0.5); hole.tx=Math.max(hole.r,Math.min(WORLD-hole.r,hole.tx+wx*sp)); hole.ty=Math.max(hole.r,Math.min(WORLD-hole.r,hole.ty+wy*sp)); }

const CHEERS=['Smakelijk! 😋','Hap!','Mmm, lekker!','Boem! 💥','Nog meer!','Gulp!','Zo groot al?! 😮'];

function loop(now){
  const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  if(playing){
    timeLeft-=dt; if(timeLeft<=0){ timeLeft=0; return endGame(); }
    hole.x+=(hole.tx-hole.x)*0.16; hole.y+=(hole.ty-hole.y)*0.16;
    for(const o of objects){
      if(o.eaten)continue;
      const d=Math.hypot(o.x-hole.x,o.y-hole.y);
      if(d<hole.r && o.r<hole.r*0.92){
        o.eaten=true; o.fall=0; score+=o.pts; hole.r+=o.r*0.085;
        shake=Math.min(14,shake+o.r*0.15); gulp(o.r);
        if(o.r>28){ funText=pick(CHEERS); funTimer=0.9; }
        for(let k=0;k<7;k++)particles.push({x:o.x,y:o.y,z:rand(0,20),vx:rand(-50,50),vy:rand(-50,50),vz:rand(30,90),life:0.6,c:o.c});
        updateHUD();
      }
    }
    for(const o of objects) if(o.eaten&&o.fall<1){ o.fall+=dt*2.6; o.x+=(hole.x-o.x)*0.2; o.y+=(hole.y-o.y)*0.2; }
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vz-=200*dt; p.life-=dt; }
    particles=particles.filter(p=>p.life>0);
    if(shake>0)shake=Math.max(0,shake-dt*40);
    if(funTimer>0)funTimer-=dt;
  }
  draw(); requestAnimationFrame(loop);
}

function draw(){
  const cx=W/2, cy=H/2;
  const p0=hole?proj(hole.x,hole.y,0):{x:0,y:0};
  const shX=shake?rand(-shake,shake):0, shY=shake?rand(-shake,shake):0;
  const ox=cx-p0.x+shX, oy=cy-p0.y+shY;      // camera offset
  const S=(wx,wy,wz)=>{ const p=proj(wx,wy,wz); return{x:p.x+ox,y:p.y+oy}; };

  // lucht
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#8ecae6'); sky.addColorStop(1,'#c3e8ff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // grond (iso vierkant)
  ctx.beginPath();
  const c0=S(0,0,0),c1=S(WORLD,0,0),c2=S(WORLD,WORLD,0),c3=S(0,WORLD,0);
  ctx.moveTo(c0.x,c0.y); ctx.lineTo(c1.x,c1.y); ctx.lineTo(c2.x,c2.y); ctx.lineTo(c3.x,c3.y); ctx.closePath();
  ctx.fillStyle='#6ab04c'; ctx.fill();
  // straten-raster
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=10;
  ctx.beginPath();
  for(let g=0;g<=WORLD;g+=250){ let a=S(g,0),b=S(g,WORLD); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); let c=S(0,g),d=S(WORLD,g); ctx.moveTo(c.x,c.y); ctx.lineTo(d.x,d.y);} ctx.stroke();

  if(!hole)return;

  // ---- teken-lijst: gat + objecten, gesorteerd op diepte ----
  const items=objects.filter(o=>!(o.eaten&&o.fall>=1)).slice();
  items.push({isHole:true,x:hole.x,y:hole.y});
  items.sort((a,b)=>(a.x+a.y)-(b.x+b.y));

  for(const it of items){
    if(it.isHole){ drawHole(S); continue; }
    drawObj(it,S);
  }

  // deeltjes
  for(const p of particles){ const s=S(p.x,p.y,p.z); ctx.globalAlpha=Math.max(0,p.life*1.6); ctx.fillStyle=p.c; ctx.fillRect(s.x-3,s.y-3,6,6); }
  ctx.globalAlpha=1;

  // grappige tekst
  if(funTimer>0){ ctx.globalAlpha=Math.min(1,funTimer*2); ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=4; ctx.font='800 34px -apple-system,sans-serif'; ctx.textAlign='center'; const hp=S(hole.x,hole.y,hole.r+40); ctx.strokeText(funText,hp.x,hp.y); ctx.fillText(funText,hp.x,hp.y); ctx.globalAlpha=1; ctx.textAlign='left'; }
}

function drawHole(S){
  const b=S(hole.x,hole.y,0); const rx=hole.r, ry=hole.r*ISO;
  // schaduwrand
  ctx.save(); ctx.translate(b.x,b.y); ctx.scale(1,ISO);
  const g=ctx.createRadialGradient(0,0,hole.r*0.2,0,0,hole.r);
  g.addColorStop(0,'#000'); g.addColorStop(.85,'#050510'); g.addColorStop(1,'#2a2a45');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,hole.r,0,6.2832); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,hole.r,0,6.2832); ctx.stroke();
  ctx.restore();
}

function drawObj(o,S){
  const wob=o.eaten?0:Math.sin(performance.now()/500+o.wob)*1.2;
  const h=o.h*(o.eaten?Math.max(0,1-o.fall):1);
  const scale=o.eaten?Math.max(0,1-o.fall):1;
  if(scale<=0.02)return;
  const r=o.r*scale;
  // 3D-doosje: bodem op z=0, top op z=h
  const bx=o.x, by=o.y;
  const A=S(bx-r,by-r,0),B=S(bx+r,by-r,0),C=S(bx+r,by+r,0),D=S(bx-r,by+r,0);
  const At=S(bx-r,by-r,h),Bt=S(bx+r,by-r,h),Ct=S(bx+r,by+r,h),Dt=S(bx-r,by+r,h);
  const shade=(hex,f)=>{ const n=parseInt(hex.slice(1),16); let R=(n>>16)*f,Gg=((n>>8)&255)*f,Bb=(n&255)*f; return`rgb(${R|0},${Gg|0},${Bb|0})`; };
  // schaduw op grond
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); const sh=S(bx,by,0); ctx.save(); ctx.translate(sh.x,sh.y+3); ctx.scale(1,ISO); ctx.arc(0,0,r*1.1,0,6.2832); ctx.fill(); ctx.restore();
  // rechter zijvlak
  ctx.fillStyle=shade(o.c,.65); ctx.beginPath(); ctx.moveTo(B.x,B.y+wob); ctx.lineTo(C.x,C.y+wob); ctx.lineTo(Ct.x,Ct.y+wob); ctx.lineTo(Bt.x,Bt.y+wob); ctx.fill();
  // linker zijvlak
  ctx.fillStyle=shade(o.c,.5); ctx.beginPath(); ctx.moveTo(D.x,D.y+wob); ctx.lineTo(C.x,C.y+wob); ctx.lineTo(Ct.x,Ct.y+wob); ctx.lineTo(Dt.x,Dt.y+wob); ctx.fill();
  // topvlak
  ctx.fillStyle=shade(o.c,1); ctx.beginPath(); ctx.moveTo(At.x,At.y+wob); ctx.lineTo(Bt.x,Bt.y+wob); ctx.lineTo(Ct.x,Ct.y+wob); ctx.lineTo(Dt.x,Dt.y+wob); ctx.closePath(); ctx.fill();
  // emoji bovenop
  if(scale>0.4){ const top=S(bx,by,h); ctx.font=(r*1.5|0)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(o.e,top.x,top.y-r*0.3+wob); ctx.textAlign='left'; ctx.textBaseline='alphabetic'; }
}

function endGame(){
  playing=false;
  let rank='een klein gaatje 🐣';
  if(hole.r>60)rank='een flink gat 👍'; if(hole.r>110)rank='een MEGA gat! 🔥'; if(hole.r>180)rank='een STAD-verslindend monstergat! 🌍😱';
  endTitle.textContent='Tijd om! 🎉';
  endMsg.innerHTML='Je scoorde <b>'+score+'</b> punten<br>en groeide uit tot <b>'+rank+'</b>';
  endScreen.style.display='flex';
}
</script>
</body>
</html>
